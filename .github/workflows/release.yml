name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: bitctx-x86_64-linux
            cross: "false"
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            artifact: bitctx-aarch64-linux
            cross: "true"
          - target: x86_64-apple-darwin
            os: macos-latest
            artifact: bitctx-x86_64-macos
            cross: "false"
          - target: aarch64-apple-darwin
            os: macos-latest
            artifact: bitctx-aarch64-macos
            cross: "false"
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            artifact: bitctx-x86_64-windows
            ext: .exe
            cross: "false"
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross (for aarch64-linux)
        if: matrix.cross == 'true'
        run: cargo install cross --locked

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Build
        working-directory: bitctx-cli
        run: |
          if [ "${{ matrix.cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package artifact
        working-directory: bitctx-cli
        shell: bash
        run: |
          BINARY="target/${{ matrix.target }}/release/bitctx${{ matrix.ext }}"
          mkdir -p dist
          cp "$BINARY" "dist/${{ matrix.artifact }}${{ matrix.ext }}"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "${{ matrix.artifact }}${{ matrix.ext }}" > "${{ matrix.artifact }}${{ matrix.ext }}.sha256"
          elif command -v shasum >/dev/null; then
            shasum -a 256 "${{ matrix.artifact }}${{ matrix.ext }}" > "${{ matrix.artifact }}${{ matrix.ext }}.sha256"
          elif command -v certutil >/dev/null; then
            certutil -hashfile "${{ matrix.artifact }}${{ matrix.ext }}" SHA256 > "${{ matrix.artifact }}${{ matrix.ext }}.sha256"
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: bitctx-cli/dist/
          retention-days: 1

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show artifacts
        run: ls -la dist/

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/**/*
          generate_release_notes: true
          draft: false
          prerelease: false